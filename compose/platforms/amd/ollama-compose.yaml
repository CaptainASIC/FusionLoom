version: "3"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: fusionloom-ollama
    volumes:
      - ${OLLAMA_VOLUME}:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      # AMD ROCm optimizations
      - OLLAMA_CPU_ONLY=0
      # Adjust these based on the host system capabilities
      - OLLAMA_NUM_THREADS=16
      - OLLAMA_MAX_MEMORY=16G
    restart: unless-stopped
    labels:
      - "io.containers.autoupdate=image"
    networks:
      - fusionloom_net
    # Add AMD GPU devices
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    # Resource limits for AMD GPU operation
    deploy:
      resources:
        limits:
          cpus: '0.8' # Use up to 80% of available CPU
          memory: 20G

networks:
  fusionloom_net:
    external: true
