version: "3"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: fusionloom-ollama
    volumes:
      - ${OLLAMA_VOLUME}:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      # DGX/Digit optimizations
      - OLLAMA_CPU_ONLY=0
      # Multi-GPU support
      - OLLAMA_MULTI_GPU=1
      # Adjust these based on the DGX/Digit capabilities
      - OLLAMA_NUM_THREADS=64
      - OLLAMA_MAX_MEMORY=96G
    restart: unless-stopped
    labels:
      - "io.containers.autoupdate=image"
    networks:
      - fusionloom_net
    # Add NVIDIA GPU support with all GPUs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 100G

networks:
  fusionloom_net:
    external: true
