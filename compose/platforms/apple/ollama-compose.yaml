version: "3"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: fusionloom-ollama
    volumes:
      - ${OLLAMA_VOLUME}:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Apple Silicon optimizations
      - OLLAMA_CPU_ONLY=0
      # Metal GPU acceleration
      - OLLAMA_USE_METAL=1
      # Adjust these based on the host system capabilities
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_MAX_MEMORY=12G
    restart: unless-stopped
    labels:
      - "io.containers.autoupdate=image"
    networks:
      - fusionloom_net
    platform: linux/arm64  # Specify ARM64 platform for Apple Silicon
    # Resource limits for Apple Silicon
    deploy:
      resources:
        limits:
          cpus: '0.8' # Use up to 80% of available CPU
          memory: 16G

networks:
  fusionloom_net:
    external: true
