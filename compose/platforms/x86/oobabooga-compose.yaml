version: "3"

services:
  oobabooga:
    image: ghcr.io/oobabooga/text-generation-webui:latest
    container_name: fusionloom-oobabooga
    ports:
      - "7860:7860"  # Web UI port
      - "5000:5000"  # API port
    volumes:
      - ${OOBABOOGA_VOLUME}/cache:/home/app/text-generation-webui/cache
      - ${OOBABOOGA_VOLUME}/characters:/home/app/text-generation-webui/characters
      - ${OOBABOOGA_VOLUME}/extensions:/home/app/text-generation-webui/extensions
      - ${OOBABOOGA_VOLUME}/loras:/home/app/text-generation-webui/loras
      - ${OOBABOOGA_VOLUME}/logs:/home/app/text-generation-webui/logs
      - ${OOBABOOGA_VOLUME}/models:/home/app/text-generation-webui/models
      - ${OOBABOOGA_VOLUME}/presets:/home/app/text-generation-webui/presets
      - ${OOBABOOGA_VOLUME}/prompts:/home/app/text-generation-webui/prompts
      - ${OOBABOOGA_VOLUME}/softprompts:/home/app/text-generation-webui/softprompts
      - ${OOBABOOGA_VOLUME}/training:/home/app/text-generation-webui/training
    environment:
      - CLI_ARGS=--listen --api --cpu
    restart: unless-stopped
    labels:
      - "io.containers.autoupdate=image"
    networks:
      - fusionloom_net

networks:
  fusionloom_net:
    external: true
