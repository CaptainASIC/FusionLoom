version: "3"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: fusionloom-ollama
    volumes:
      - ${OLLAMA_VOLUME}:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Jetson Orin Nano 4GB optimizations
      - OLLAMA_CPU_ONLY=0
      # Limited resources for Orin Nano 4GB
      - OLLAMA_NUM_THREADS=4
      - OLLAMA_MAX_MEMORY=3G
    restart: unless-stopped
    labels:
      - "io.containers.autoupdate=image"
    networks:
      - fusionloom_net
    # Add NVIDIA GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 3500M
    platform: linux/arm64  # Specify ARM64 platform for Jetson

networks:
  fusionloom_net:
    external: true
