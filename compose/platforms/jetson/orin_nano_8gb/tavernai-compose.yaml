version: "3"

services:
  tavernai:
    image: tavernai/tavernai:latest
    container_name: fusionloom-tavernai
    ports:
      - "8001:8000"  # Using 8001 to avoid conflict with SillyTavern
    volumes:
      - ${TAVERNAI_PUBLIC_VOLUME}:/home/node/app/public
      - ${TAVERNAI_CONFIG_VOLUME}:/home/node/app/config.conf
    restart: unless-stopped
    labels:
      - "io.containers.autoupdate=image"
    networks:
      - fusionloom_net
    platform: linux/arm64  # Specify ARM64 platform for Jetson

networks:
  fusionloom_net:
    external: true
