[General]
theme = dark
save_sessions = true

[Endpoints]
ollama_api = http://localhost:11434
anthropic_api = https://api.anthropic.com/v1
openai_api = https://api.openai.com/v1
gemini_api = https://generativelanguage.googleapis.com/v1
grok_api = https://api.grok.x/v1
sd_api = http://localhost:7860
dalle_api = https://api.openai.com/v1/images
midjourney_api = http://localhost:7861
tts_api = http://localhost:5500/api/tts
stt_api = http://localhost:5501/api/stt
openai_audio_api = https://api.openai.com/v1/audio

[Containers]
auto_start = true
container_engine = podman

[Hardware]
gpu_vendor = auto
gpu_memory_limit = 8G
acceleration = true
platform = auto
power_mode = performance

[API_Keys]
# Add your API keys here
anthropic_key = YOUR_ANTHROPIC_API_KEY
openai_key = YOUR_OPENAI_API_KEY
gemini_key = YOUR_GEMINI_API_KEY

[Hardware_Builds]
# Default build (always enabled)
default = true

# NVIDIA GPU builds
nvidia = false
dgx_digit = false

# NVIDIA Jetson builds
jetson_orin = false
jetson_agx = false

# AMD GPU builds
amd_x86 = false

# Apple Silicon builds
apple_silicon = false
